# =============================================================================
# ZPL2PDF - Docker Compose para Coolify
# =============================================================================
# Modo: API HTTP (POST /api/convert, GET /api/health)
#
# No Coolify:
#   - Docker Compose Location: /docker-compose.coolify.yml
#   - Domains: http://seu-dominio.com:5000
# =============================================================================

services:
  zpl2pdf:
    build:
      context: .
      dockerfile: Dockerfile.coolify
    image: zpl2pdf-api:latest

    expose:
      - "5000"

    labels:
      - "traefik.enable=true"
      - "traefik.http.services.zpl2pdf.loadbalancer.server.port=5000"
      - "traefik.docker.network=coolify"

    environment:
      ZPL2PDF_LANGUAGE: ${ZPL2PDF_LANGUAGE:-en-US}
      ZPL2PDF_PORT: "5000"
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
      DOTNET_RUNNING_IN_CONTAINER: "true"
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    restart: unless-stopped

    networks:
      - coolify

networks:
  coolify:
    external: true
